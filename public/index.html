<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Commander</title>
  <script>
    // Apply saved theme immediately to prevent FOUC
    (function() {
      var saved = localStorage.getItem('color_theme') || 'dark-navy';
      document.body.setAttribute('data-theme', saved);
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
</head>
<body data-theme="dark-navy">
  <header class="header">
    <div class="header-left">
      <button class="view-toggle active" data-view="kanban" title="Kanban View">
        <span class="icon">&#9638;</span> KANBAN
      </button>
      <button class="view-toggle" data-view="list" title="List View">
        <span class="icon">&#9776;</span> LIST
      </button>
    </div>
    <div class="header-right">
      <button class="btn-settings" id="btnSettings">Setting</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-left">
      <label for="projectGroupSelect">Project Group:</label>
      <select id="projectGroupSelect">
        <option value="default">default</option>
      </select>
    </div>
    <div class="toolbar-right">
      <button class="btn btn-ghost" id="btnNewGroup" onclick="KanbanBoard.openNewGroupModal()">+ Group</button>
      <div class="dropdown" id="orchestratorDropdown">
        <button class="btn-orchestrator dropdown-toggle" id="btnOrchestrator">
          Open Orchestrator <span class="dropdown-arrow">&#9662;</span>
        </button>
        <div class="dropdown-menu" id="orchestratorMenu">
          <button class="dropdown-item" data-provider="claude-code">Claude Code</button>
          <button class="dropdown-item" data-provider="opencode">OpenCode</button>
        </div>
      </div>
    </div>
  </div>

  <main class="main-content">
    <div id="dashboardSection"></div>
    <div id="kanbanView" class="view-container active"></div>
    <div id="listView" class="view-container"></div>
    <div id="settingsView" class="view-container"></div>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" id="modalContent"></div>
  </div>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/xterm-addon-fit/lib/addon-fit.js"></script>
  <script src="/vendor/xterm-addon-web-links/lib/addon-web-links.js"></script>
  <script src="/js/ws-client.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/kanban.js"></script>
  <script src="/js/list-view.js"></script>
  <script src="/js/task-progress.js"></script>
  <script src="/js/deleted-task.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/orchestrator.js"></script>
  <script src="/js/app.js"></script>

  <!-- Orchestrator Slide-in Panel -->
  <div id="orchestratorPanel" class="orchestrator-panel">
    <div class="orchestrator-panel-header">
      <span class="orchestrator-panel-title">Orchestrator</span>
      <span id="orchestratorProviderLabel" class="orchestrator-panel-provider"></span>
      <div style="flex:1;"></div>
      <button class="btn btn-ghost btn-sm" id="btnCloseOrchestrator">&times;</button>
    </div>
    <div class="orchestrator-terminal-wrap" id="orchestratorTerminalWrap">
      <div id="orchestratorTerminal"></div>
    </div>
  </div>
</body>
</html>
